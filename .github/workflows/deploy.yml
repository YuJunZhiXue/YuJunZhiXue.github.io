name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 让 GitHub Pages 部署有正确的写权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许跑一个部署，避免冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖（含 Butterfly 主题与搜索插件）
        run: npm ci
        continue-on-error: true

      - name: 安装依赖（lockfile 缺失时兜底）
        run: npm install --no-audit --no-fund

      - name: 生成静态页面
        run: npx hexo clean && npx hexo g

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
