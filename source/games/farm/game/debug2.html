<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Farm Debug2</title></head>
<body>
<canvas id="game-canvas" width="320" height="240"></canvas>
<pre id="log"></pre>
<script type="module">
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
log('1. starting');
try {
    const Game = (await import('./src/Game.js')).default;
    log('2. Game imported');
    const game = new Game('game-canvas');
    log('3. Game constructed');
    // Hook initWorld to catch errors
    const origInit = game.initWorld.bind(game);
    game.initWorld = function() {
        try {
            log('4. initWorld called');
            origInit();
            log('5. initWorld OK, world=' + (game.world ? 'exists' : 'null'));
        } catch(e) {
            log('INITWORLD ERROR: ' + e.message + '\n' + e.stack);
        }
    };
    game.start();
    log('6. game.start() called, waiting 7s...');
    setTimeout(() => {
        log('7. after 7s: world=' + (game.world ? 'exists' : 'null') + ', assetsLoaded=' + game.assetsLoaded + '/' + game.totalAssets);
    }, 7000);
} catch(e) {
    log('FATAL: ' + e.message + '\n' + e.stack);
}
</script>
</body>
</html>
