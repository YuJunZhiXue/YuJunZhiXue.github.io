<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Farm Debug5</title>
<style>canvas{width:640px;height:480px;image-rendering:pixelated;background:#000}</style>
</head>
<body>
<canvas id="game-canvas" width="320" height="240"></canvas>
<pre id="log" style="white-space:pre-wrap;max-width:900px"></pre>
<script type="module">
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
try {
    const Game = (await import('./src/Game.js')).default;
    const game = new Game('game-canvas');
    // Don't use game.start(); manually load one tileset and draw one tile
    const tm = game.tilesetManager;
    log('loading spring tileset...');
    try {
        const ts = await tm.loadTileset('spring', 'assets/16x16/Tilesets_Modular/vectoraith_tileset_farmingsims_terrain_spring_expanded.png', { tileSize: 16, offsetX: 0, offsetY: 0 });
        log('tileset loaded: ' + ts.image.width + 'x' + ts.image.height + ', cols=' + ts.columns);
        log('tilesets keys: ' + Object.keys(tm.tilesets).join(','));
    } catch(e) {
        log('tileset FAILED: ' + e.message);
    }
    // Now manually draw tile 16 (GRASS) at 0,0
    const ctx = game.ctx;
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, 320, 240);
    tm.drawTile(ctx, 'spring', 16, 0, 0);
    tm.drawTile(ctx, 'spring', 16, 16, 0);
    tm.drawTile(ctx, 'spring', 32, 32, 0);
    log('drawTile calls done - check canvas visually');
    // Check a pixel
    const px = ctx.getImageData(8, 8, 1, 1).data;
    log('pixel at (8,8): rgba(' + px[0] + ',' + px[1] + ',' + px[2] + ',' + px[3] + ')');
    const px2 = ctx.getImageData(160, 120, 1, 1).data;
    log('pixel at center (160,120): rgba(' + px2[0] + ',' + px2[1] + ',' + px2[2] + ',' + px2[3] + ')');
} catch(e) {
    log('FATAL: ' + e.message + '\n' + (e.stack||'').split('\n').slice(0,6).join('\n'));
}
</script>
</body>
</html>
