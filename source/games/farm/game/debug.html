<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Farm Debug</title></head>
<body>
<pre id="log"></pre>
<script type="module">
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
log('1. module script executing');
try {
    const Game = (await import('./src/Game.js')).default;
    log('2. Game.js imported OK');
    window.addEventListener('load', () => {
        log('3. window load event fired');
        try {
            // Don't actually start, just test constructor
            log('4. testing complete - imports work');
        } catch(e) { log('ERROR: ' + e.message + '\n' + e.stack); }
    });
    setTimeout(() => log('5. 3s timeout - if no load event, it never fired'), 3000);
} catch(e) {
    log('IMPORT ERROR: ' + e.message + '\n' + e.stack);
}
</script>
</body>
</html>
