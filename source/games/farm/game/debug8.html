<!DOCTYPE html><html><head><meta charset="UTF-8"><title>D8</title></head><body>
<pre id="log"></pre>
<script type="module">
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
try {
    const src = await (await fetch('./src/Game.js')).text();
    const hasNew = src.includes('assets/tiles/spring.png');
    const hasOld = src.includes('Tilesets_Modular');
    log('has new tiles path: ' + hasNew);
    log('has old Tilesets_Modular: ' + hasOld);
    // Try loading the new path directly
    const img = new Image();
    img.onload = () => log('tiles/spring.png: OK ' + img.width + 'x' + img.height);
    img.onerror = () => log('tiles/spring.png: FAIL');
    img.src = 'assets/tiles/spring.png';
} catch(e) { log('FATAL: ' + e.message); }
</script></body></html>
