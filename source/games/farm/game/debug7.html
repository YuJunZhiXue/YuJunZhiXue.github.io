<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Farm Debug7</title>
</head>
<body>
<pre id="log" style="white-space:pre-wrap;max-width:900px"></pre>
<script type="module">
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
try {
    const Game = (await import('./src/Game.js')).default;
    // Create canvas
    const c = document.createElement('canvas');
    c.id = 'game-canvas'; c.width = 320; c.height = 240;
    document.body.appendChild(c);
    const game = new Game('game-canvas');
    log('calling game.start()...');
    game.start();
    // Wait 8 seconds
    await new Promise(r => setTimeout(r, 8000));
    log('after 8s:');
    log('assetsLoaded=' + game.assetsLoaded + '/' + game.totalAssets);
    log('world=' + (game.world ? 'exists' : 'NULL'));
    log('tilesets keys: ' + Object.keys(game.tilesetManager.tilesets).join(','));
    for (const [name, ts] of Object.entries(game.tilesetManager.tilesets)) {
        log('  ' + name + ': ' + ts.image.width + 'x' + ts.image.height + ', broken=' + (ts.image.naturalWidth===0));
    }
    // Check each asset image
    for (const [name, img] of Object.entries(game.assets)) {
        log('asset ' + name + ': complete=' + img.complete + ', broken=' + (img.naturalWidth===0));
    }
} catch(e) {
    log('FATAL: ' + e.message + '\n' + (e.stack||'').split('\n').slice(0,8).join('\n'));
}
</script>
</body>
</html>
