<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Farm Debug3</title></head>
<body>
<pre id="log"></pre>
<script type="module">
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
const assets = [
    ['player', 'assets/16x16/Sprites/$farmer.png'],
    ['house', 'assets/16x16/Tilesets_Modular/vectoraith_tileset_farmingsims_buildings.png'],
    ['details', 'assets/16x16/Tilesets_Compact/vectoraith_tileset_farmingsims_details.png'],
    ['babyChicken', 'assets/16x16/Sprites/$chicken_chick.png'],
    ['chicken', 'assets/16x16/Sprites/$chicken_hen.png'],
    ['cow', 'assets/16x16/Sprites/$cow_brown.png'],
    ['chest', 'assets/Objects/chest.png'],
    ['spring', 'assets/16x16/Tilesets_Modular/vectoraith_tileset_farmingsims_terrain_spring_expanded.png'],
    ['summer', 'assets/16x16/Tilesets_Modular/vectoraith_tileset_farmingsims_terrain_summer_expanded.png'],
    ['fall', 'assets/16x16/Tilesets_Modular/vectoraith_tileset_farmingsims_terrain_fall_expanded.png'],
    ['winter', 'assets/16x16/Tilesets_Modular/vectoraith_tileset_farmingsims_terrain_winter_expanded.png'],
    ['crops', 'assets/16x16/Tilesets_Compact/vectoraith_tileset_farmingsims_crops.png'],
    ['fence', 'assets/Objects/Fence_copiar.png'],
];
for (const [name, path] of assets) {
    const img = new Image();
    img.onload = () => log(`OK: ${name}`);
    img.onerror = (e) => log(`FAIL: ${name} (${path})`);
    img.src = path;
}
setTimeout(() => log('done waiting'), 8000);
</script>
</body>
</html>
