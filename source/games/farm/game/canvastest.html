<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Canvas Test</title></head>
<body>
<canvas id="game-canvas" width="320" height="240" style="width:640px;height:480px;image-rendering:pixelated"></canvas>
<pre id="log"></pre>
<script type="module">
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
log('canvas: ' + canvas.width + 'x' + canvas.height);
log('ctx: ' + (ctx ? 'OK' : 'NULL'));

// Test 1: fill rect
ctx.fillStyle = '#00ff00';
ctx.fillRect(0, 0, 320, 240);
log('fillRect done');

// Test 2: draw image
const img = new Image();
img.onload = () => {
    log('image loaded: ' + img.width + 'x' + img.height);
    try {
        ctx.drawImage(img, 0, 0);
        log('drawImage done');
    } catch(e) {
        log('drawImage ERROR: ' + e.message);
    }
    // Test 3: tileset draw (like the game does)
    try {
        const tileSize = 16;
        const cols = Math.floor(img.width / tileSize);
        const tileId = 16;
        const srcX = (tileId % cols) * tileSize;
        const srcY = Math.floor(tileId / cols) * tileSize;
        ctx.drawImage(img, srcX, srcY, tileSize, tileSize, 100, 100, tileSize, tileSize);
        log('tile draw done, cols=' + cols);
    } catch(e) {
        log('tile draw ERROR: ' + e.message);
    }
};
img.onerror = (e) => log('image FAILED to load');
img.src = 'assets/16x16/Tilesets_Modular/vectoraith_tileset_farmingsims_terrain_spring_expanded.png';

// Test 4: requestAnimationFrame
let frames = 0;
function loop() {
    frames++;
    if (frames === 60) log('RAF loop running, 60 frames OK');
    if (frames < 120) requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
log('RAF started');
</script>
</body>
</html>
