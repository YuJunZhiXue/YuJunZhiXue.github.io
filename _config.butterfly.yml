# Butterfly 主题个性化配置（覆盖主题默认值）

# ==================== 导航 ====================
nav:
  logo: /images/avstar.jpg
  display_title: true
  display_post_title: true
  fixed: true   # 固定吸顶

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  友链: /links/ || fas fa-link
  音乐: /music/ || fas fa-music

# ==================== 配色（古风·水墨朱砂）====================
theme_color:
  enable: true
  main: "#8c3b2e"
  paginator: "#8c3b2e"
  button_hover: "#a8351f"
  text_selection: "#8c3b2e"
  link_color: "#5a4a3a"
  meta_color: "#8a7a68"
  hr_color: "#b0a48e"
  code_foreground: "#8c3b2e"
  code_background: "rgba(140, 59, 46, .06)"
  toc_color: "#8c3b2e"
  blockquote_padding_color: "#8c3b2e"
  blockquote_background_color: "#8c3b2e"
  scrollbar_color: "#b0a48e"
  meta_theme_color_light: "#f5f1e8"
  meta_theme_color_dark: "#14110e"

# ==================== 字体（思源）====================
blog_title_font:
  font_link: https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.0.18/700.css
  font_family: 'Noto Serif SC, "Songti SC", "SimSun", serif'

font:
  global_font_size: 16px
  code_font_size: 14px
  font_family: 'Noto Serif SC, "Songti SC", "SimSun", "STSong", serif'
  code_font_family: '"JetBrains Mono", consolas, Menlo, monospace, serif'

# 全站额外注入：古风皮肤 + 思源宋体 + 音乐播放器
inject:
  head:
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.0.18/400.css">
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.0.18/500.css">
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.0.18/700.css">
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.18/400.css">
    - <link rel="stylesheet" href="/css/custom-gufeng.css">
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
  bottom:
    - <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    - <script src="https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js"></script>

# ==================== 图片资源 ====================
favicon: /images/avstar.jpg

avatar:
  img: /images/avstar.jpg
  effect: true

# 各页面横幅（古风留白，不强行塞图，用主题默认即可）
index_img:
archive_img:
tag_img:
category_img:

# 页脚留白
footer_img: false

# 背景留白（古风：不堆图，靠 CSS 水墨晕染，见 custom-gufeng）
background:

# 封面图池（仅文章无封面时兜底，古风水墨意境）
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /images/683017.jpg
    - /images/960489.png
    - /images/legacy.png
    - /images/hexo.jpg

error_img:
  flink: /images/avstar.jpg
  post_page: /images/legacy.png

# 404 页面定制
error_404:
  enable: true
  subtitle: '页面不存在，回首页看看吧'
  background: /images/legacy.png

# ==================== 文章排版 ====================
# 行首缩进
text_align_justify: true

# 标题图标前缀
beautify:
  enable: true
  field: post
  title_prefix_icon: '\f0c1'
  title_prefix_icon_color: '#00ffd5'

# 分割线图标
hr_icon:
  enable: true
  icon: '\f0e7'
  icon_top: -10px

# ==================== 默认显示模式 ====================
display_mode: light
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

# ==================== 首页副标题（打字机）====================
subtitle:
  enable: true
  effect: true
  typed_option:
    typeSpeed: 60
    backSpeed: 30
    startDelay: 300
    backDelay: 1500
    loop: true
  source: false
  sub:
    - 记录技术、创造与探索
    - 保持热爱，奔赴山海
    - 代码写尽世间浪漫

# ==================== 首页布局 ====================
# 3: 封面与信息左右交替
index_layout: 3

index_post_content:
  method: 2
  length: 500

index_top_img_height: 80vh

# ==================== 代码块 ====================
code_blocks:
  theme: darker
  macStyle: true
  copy: true
  language: true
  shrink: none
  word_wrap: false

# ==================== 背景动效（古风：静态留白，关掉线条粒子）====================
canvas_fluttering_ribbon:
  enable: false
  mobile: false

canvas_nest:
  enable: false
  color: '140,59,46'
  opacity: 0.5
  zIndex: -1
  count: 60
  mobile: false

# ==================== 鼠标点击特效 ====================
fireworks:
  enable: true
  zIndex: 9999
  mobile: false

click_heart:
  enable: true
  mobile: false

clickShowText:
  enable: true
  text:
    - 热爱
    - 创造
    - 探索
  fontSize: 15px
  random: true
  mobile: false

# 敲击粒子特效
activate_power_mode:
  enable: true
  colorful: true
  shake: true
  mobile: false

# ==================== 加载与过渡 ====================
preloader:
  enable: true
  source: 2

enter_transitions: true

# 图片懒加载 + 模糊占位
lazyload:
  enable: true
  native: false
  field: site
  placeholder: https://cdn.jsdelivr.net/npm/loading.js@2.3.5/loading.svg
  blur: true

# ==================== 图片灯箱 ====================
lightbox: fancybox

# ==================== 搜索 ====================
search:
  use: local_search
  local_search:
    preload: true
    top_n_per_article: 3
    unescape: false

# ==================== 页脚 ====================
footer:
  nav: false
  owner:
    enable: true
    since: 2018
  copyright:
    enable: true
    version: true
  custom_text: '<span style="color:#00ffd5">用 ❤️ 搭建</span>'

# ==================== 侧边栏 ====================
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 记录技术、创造与探索
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/YuJunZhiXue
  card_announcement:
    enable: true
    content: 欢迎来到我的博客
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: true
    custom_colors:
      - "#00ffd5"
      - "#FF7242"
      - "#7b2ff7"
      - "#49B1F5"
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_post_series:
    enable: true
    series_title: false
    orderBy: 'date'
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 2018/02/04 00:00:00

# ==================== 文章页 ====================
toc:
  post: true
  page: false
  number: true
  expand: true
  scroll_percent: true

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# 版权声明
post_copyright:
  enable: true
  decode: false
  author_href: https://YuJunZhiXue.github.io
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 打赏
reward:
  enable: true
  text: 请作者喝杯咖啡
  QR_code:
    - img: /images/wechat.jpg
      link:
      text: 微信
    - img: /images/alipa.jpg
      link:
      text: 支付宝

# 在线编辑跳转
post_edit:
  enable: true
  url: https://github.com/YuJunZhiXue/YuJunZhiXue.github.io/edit/main/source/_posts/

# 相关文章
related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

# ==================== 字数统计 ====================
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# ==================== 访问统计 ====================
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# ==================== 阅读模式 ====================
readmode: true

# ==================== 分享 ====================
share:
  use: sharejs
  sharejs:
    sites: weibo,qq,wechat,twitter,facebook

# ==================== 音乐播放器 ====================
# MetingJS 全局悬浮播放器（在下方 inject 中注入）
# 页面级播放器见 source/music/index.md

# ==================== 其他 ====================
anchor:
  auto_update: true
  click_to_scroll: true

photofigcaption: true

copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

# 页面切换动画细节
rightside_scroll_percent: true
rightside_config_animation: true

# 繁简转换
translate:
  enable: false
