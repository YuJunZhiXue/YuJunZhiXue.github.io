# Butterfly 主题个性化配置（覆盖主题默认值）

# ==================== 导航 ====================
nav:
  logo: /images/avstar.jpg
  display_title: true
  display_post_title: true
  fixed: true   # 固定吸顶

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  说说: /shuoshuo/ || fas fa-comment-dots
  相册: /album/ || fas fa-camera-retro
  项目: /projects/ || fas fa-code-branch
  书影: /books/ || fas fa-book
  留言: /message/ || fas fa-pen-nib
  友链: /links/ || fas fa-link
  音乐: /music/ || fas fa-music

# ==================== 配色（古风·水墨朱砂）====================
theme_color:
  enable: true
  main: "#49b1f5"
  paginator: "#49b1f5"
  button_hover: "#a8351f"
  text_selection: "#49b1f5"
  link_color: "#5a4a3a"
  meta_color: "#8a7a68"
  hr_color: "#b0a48e"
  code_foreground: "#49b1f5"
  code_background: "rgba(140, 59, 46, .06)"
  toc_color: "#49b1f5"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "rgba(73,177,245,.1)"
  scrollbar_color: "#b0a48e"
  meta_theme_color_light: "#f5f1e8"
  meta_theme_color_dark: "#14110e"

# ==================== 字体（思源）====================
blog_title_font:
  font_link: /fonts/noto-serif-sc-700.css
  font_family: 'Noto Serif SC, "Songti SC", "SimSun", serif'

font:
  global_font_size: 16px
  code_font_size: 14px
  font_family: 'Noto Serif SC, "Songti SC", "SimSun", "STSong", serif'
  code_font_family: '"JetBrains Mono", consolas, Menlo, monospace, serif'

# 全站注入：全部本地化，零外链 CDN（国内国外都快）
inject:
  head:
    - <link rel="stylesheet" href="/fonts/noto-serif-sc-400.css">
    - <link rel="stylesheet" href="/fonts/noto-serif-sc-500.css">
    - <link rel="stylesheet" href="/fonts/noto-sans-sc-400.css">
    - <link rel="stylesheet" href="/css/custom-gufeng.css">
    - <link rel="stylesheet" href="/css/custom-atmosphere.css">
    - <link rel="stylesheet" href="/css/custom-aside.css">
    - <link rel="stylesheet" href="/css/custom-post.css">
    - <link rel="stylesheet" href="/css/custom-home.css">
    - <link rel="stylesheet" href="/css/custom-pages.css">
    - <link rel="stylesheet" href="/css/custom-heatmap.css">
    - <link rel="stylesheet" href="/fonts/aplayer-APlayer.min.css">
    - <script src="/fonts/pace-js.min.js"></script>
  bottom:
    - <script src="/fonts/aplayer-APlayer.min.js"></script>
    - <script src="/fonts/meting-Meting.min.js"></script>
    - <script src="/js/custom-atmosphere.js"></script>
    - <script src="/js/custom-aside.js"></script>
    - <script src="/js/custom-post.js"></script>
    - <script src="/js/custom-home.js"></script>
    - <script src="/js/custom-heatmap.js"></script>
    - <script>document.addEventListener("DOMContentLoaded",function(){var f=document.getElementById("footer-wrap");if(f&&!f.querySelector(".footer-poem")){var p=document.createElement("div");p.className="footer-poem";p.innerHTML="纸上得来终觉浅，绝知此事要躬行<span class='poem-title'>—— 陆游《冬夜读书示子聿》</span>";f.insertBefore(p,f.firstChild);}});</script>
    - <script>document.addEventListener("DOMContentLoaded",function(){var aside=document.getElementById("aside-content");if(!aside)return;var host=document.querySelector(".sticky_layout")||aside;var widgets=[{id:"card-aside-search",html:'<div class="card-widget card-search"><div class="item-headline"><i class="fas fa-search"></i><span>搜索</span></div><input id="aside-search-input" type="text" placeholder="搜索文章标题…"><div class="search-results" id="aside-search-results"></div></div>'},{id:"card-aside-lunar",html:'<div class="card-widget card-lunar lunar-date" id="lunar-card"><div class="item-headline"><i class="fas fa-calendar-day"></i><span>今日</span></div><div class="lunar-gregorian" data-lunar="gregorian"></div><div class="lunar-day" data-lunar="day"></div><div class="lunar-month" data-lunar="dayname"></div><span class="lunar-jieqi" data-lunar="jieqi"></span></div>'},{id:"card-aside-gh",html:'<div class="card-widget card-github"><div class="item-headline"><i class="fab fa-github"></i><span>GitHub</span></div><div class="gh-header"><img class="gh-avatar" src="https://avatars.githubusercontent.com/YuJunZhiXue" alt="avatar" referrerpolicy="no-referrer"><div><div class="gh-name">叫我小杨同学</div><div class="gh-bio">开源项目</div></div></div><div id="gh-repos" data-username="YuJunZhiXue"></div></div>'},{id:"card-aside-heat",html:'<div class="card-widget card-heatmap"><div class="item-headline"><i class="fas fa-fire"></i><span>GitHub 活跃</span></div><div id="gh-heatmap"></div></div>'},{id:"card-aside-online",html:'<div class="card-widget card-online" id="online-card"><div class="item-headline"><i class="fas fa-chart-line"></i><span>统计</span></div><div class="online-row"><span>今日访问</span><span class="online-num" data-online="today">-</span></div><div class="online-row"><span>总访问量</span><span class="online-num" data-online="total">-</span></div></div>'},{id:"card-aside-yiyan",html:'<div class="card-widget card-yiyan" id="yiyan-card"><div class="item-headline"><i class="fas fa-feather"></i><span>一言</span></div><div class="yiyan-text" data-yiyan="text">加载中…</div><div class="yiyan-from" data-yiyan="from"></div><button class="yiyan-refresh">换一句</button></div>'}];widgets.forEach(function(w){if(!document.getElementById(w.id)){var temp=document.createElement("div");temp.innerHTML=w.html;host.appendChild(temp.firstElementChild);}});});</script>
    - '<script>document.addEventListener("DOMContentLoaded",function(){function loadMusic(){if(window.__musicLoaded)return;window.__musicLoaded=true;var m=document.createElement("meting-js");m.setAttribute("fixed","true");m.setAttribute("autoplay","false");m.setAttribute("theme","#49b1f5");m.setAttribute("server","netease");m.setAttribute("type","playlist");m.setAttribute("id","3778678");m.setAttribute("order","random");m.setAttribute("preload","none");document.body.appendChild(m);}if("requestIdleCallback" in window){requestIdleCallback(loadMusic,{timeout:4000});}else{setTimeout(loadMusic,2500);}});</script>'
    - <script>document.addEventListener("DOMContentLoaded",function(){var article=document.getElementById("article-container");if(!article||!document.getElementById("post-info"))return;var old=document.getElementById("post-actions");if(old)return;var div=document.createElement("div");div.className="post-actions";div.id="post-actions";div.innerHTML='<button class="post-action-btn post-like-btn"><span class="like-icon">♡</span> 赞 <span class="like-count">0</span></button>';article.appendChild(div);});</script>

# ==================== 图片资源 ====================
favicon: /images/avstar.jpg

avatar:
  img: /images/avstar.jpg
  effect: true

# 各页面横幅（古风留白，不强行塞图，用主题默认即可）
index_img:
archive_img:
tag_img:
category_img:

# 页脚留白
footer_img: false

# 背景留白（古风：不堆图，靠 CSS 水墨晕染，见 custom-gufeng）
background:

# 封面图池（仅文章无封面时兜底，古风水墨意境）
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /images/683017.jpg
    - /images/960489.png
    - /images/legacy.png
    - /images/hexo.jpg

error_img:
  flink: /images/avstar.jpg
  post_page: /images/legacy.png

# 404 页面定制
error_404:
  enable: true
  subtitle: '页面不存在，回首页看看吧'
  background: /images/legacy.png

# ==================== 文章排版 ====================
# 行首缩进
text_align_justify: true

# 标题图标前缀
beautify:
  enable: true
  field: post
  title_prefix_icon: '\f0c1'
  title_prefix_icon_color: '#00ffd5'

# 分割线图标
hr_icon:
  enable: true
  icon: '\f0e7'
  icon_top: -10px

# ==================== 默认显示模式 ====================
display_mode: light
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

# ==================== 首页副标题（打字机）====================
subtitle:
  enable: true
  effect: true
  typed_option:
    typeSpeed: 60
    backSpeed: 30
    startDelay: 300
    backDelay: 1500
    loop: true
  source: false
  sub:
    - 记录技术、创造与探索
    - 保持热爱，奔赴山海
    - 代码写尽世间浪漫

# ==================== 首页布局 ====================
# 3: 封面与信息左右交替
index_layout: 3

index_post_content:
  method: 2
  length: 500

index_top_img_height: 80vh

# ==================== 代码块 ====================
code_blocks:
  theme: darker
  macStyle: true
  copy: true
  language: true
  shrink: none
  word_wrap: false

# ==================== 背景动效（古风：静态留白，关掉线条粒子）====================
canvas_fluttering_ribbon:
  enable: false
  mobile: false

canvas_nest:
  enable: false
  color: '140,59,46'
  opacity: 0.5
  zIndex: -1
  count: 60
  mobile: false

# ==================== 鼠标点击特效 ====================
fireworks:
  enable: true
  zIndex: 9999
  mobile: false

click_heart:
  enable: true
  mobile: false

clickShowText:
  enable: true
  text:
    - 热爱
    - 创造
    - 探索
  fontSize: 15px
  random: true
  mobile: false

# 敲击粒子特效
activate_power_mode:
  enable: true
  colorful: true
  shake: true
  mobile: false

# ==================== 加载与过渡 ====================
preloader:
  enable: true
  source: 2

enter_transitions: true

# 图片懒加载 + 模糊占位（本地占位图，零外链）
lazyload:
  enable: true
  native: false
  field: site
  placeholder: /img/loading-gufeng.svg
  blur: true

# ==================== 图片灯箱 ====================
lightbox: fancybox

# ==================== 搜索 ====================
search:
  use: local_search
  local_search:
    preload: true
    top_n_per_article: 3
    unescape: false

# ==================== 页脚 ====================
footer:
  nav: false
  owner:
    enable: true
    since: 2018
  copyright:
    enable: true
    version: true
  custom_text: '<span style="color:#00ffd5">用 ❤️ 搭建</span>'

# ==================== 侧边栏 ====================
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 记录技术、创造与探索
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/YuJunZhiXue
  card_announcement:
    enable: true
    content: 欢迎来到我的博客
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: true
    custom_colors:
      - "#00ffd5"
      - "#FF7242"
      - "#7b2ff7"
      - "#49B1F5"
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_post_series:
    enable: true
    series_title: false
    orderBy: 'date'
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 2018/02/04 00:00:00

# ==================== 文章页 ====================
toc:
  post: true
  page: false
  number: true
  expand: true
  scroll_percent: true

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# 版权声明
post_copyright:
  enable: true
  decode: false
  author_href: https://YuJunZhiXue.github.io
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 打赏
reward:
  enable: true
  text: 请作者喝杯咖啡
  QR_code:
    - img: /images/wechat.jpg
      link:
      text: 微信
    - img: /images/alipa.jpg
      link:
      text: 支付宝

# 在线编辑跳转
post_edit:
  enable: true
  url: https://github.com/YuJunZhiXue/YuJunZhiXue.github.io/edit/main/source/_posts/

# 相关文章
related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

# ==================== 字数统计 ====================
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# ==================== 访问统计 ====================
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# ==================== 阅读模式 ====================
readmode: true

# ==================== 分享 ====================
share:
  use: sharejs
  sharejs:
    sites: weibo,qq,wechat,twitter,facebook

# ==================== 音乐播放器 ====================
# MetingJS 全局悬浮播放器（在下方 inject 中注入）
# 页面级播放器见 source/music/index.md

# ==================== 其他 ====================
anchor:
  auto_update: true
  click_to_scroll: true

photofigcaption: true

copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

# 页面切换动画细节
rightside_scroll_percent: true
rightside_config_animation: true

# 繁简转换
translate:
  enable: false
